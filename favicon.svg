<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="#1c2541"/>

  <!-- Clipboard body -->
  <rect x="8" y="10" width="16" height="17" rx="2" fill="#ffffff" opacity="0.12"/>
  <rect x="8" y="10" width="16" height="17" rx="2" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Clipboard top clip -->
  <rect x="12" y="8" width="8" height="4" rx="1.5" fill="#1c2541" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Gold accent line (top ruled line) -->
  <line x1="11" y1="16" x2="21" y2="16" stroke="#a9834f" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Checkmark (green) -->
  <polyline points="11,21 14,24 21,18" stroke="#3a5a40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
